services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: portfolio_cms
    ports:
      # Host 5433 — 5432 is used by another project (gold_postgres)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380 — 6379 is used by another project (gold_redis)
      - "6380:6379"

volumes:
  pgdata:
